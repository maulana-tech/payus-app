# The outbox worker, on a schedule Vercel's free plan will not run itself.
#
# Ordinary payments never reach this: the payer's browser calls the capture
# route and the ledger is posted inline. This is for the payment whose payer
# closed the tab after approving — PayPal's webhook lands, the work is
# queued, and without something calling this route the money stays in
# `in_flight` and the invoice still reads unpaid. It also expires Guardian
# proposals nobody answered.
#
# Needs two repository secrets: APP_URL (the deployed origin, no trailing
# slash) and CRON_SECRET (the same value the app has).
name: outbox

on:
  schedule:
    # GitHub's shortest interval is five minutes, and it queues rather than
    # guarantees — fine here, because this is the slow path by definition.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: outbox
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain the outbox
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; nothing to call."
            exit 1
          fi
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/outbox")
          echo "HTTP $code"
          cat /tmp/out.json
          echo
          # A 401 means the secret drifted; a 5xx means the app is unwell.
          # Both should fail loudly rather than look like a quiet success.
          [ "$code" = "200" ]
